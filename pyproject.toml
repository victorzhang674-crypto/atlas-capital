[project]
name = "atlas-capital"
version = "0.1.0"
description = "Atlas Capital: a multi-agent hedge fund simulator (research and paper trading only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The "core" runtime dependencies (pydantic/pydantic-settings/pyyaml/python-dotenv from Stage 02;
# structlog/python-ulid from Stage 03).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]
# Heavy groups are declared now and filled by the stage that first needs them.
quant = []
llm = []
ui = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not llm and not integration'"
markers = [
    "live: hits real network services (skipped by default)",
    "llm: calls a real LLM API (skipped by default)",
    "integration: slower multi-component tests in tests/integration (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Governing docs are owner-edited; tooling must never rewrite code blocks inside them.
extend-exclude = ["Planning", "Project.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/atlas"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Strict on the packages that hold money, risk and orders (stage protocol §3).
[[tool.mypy.overrides]]
module = ["atlas.core.*", "atlas.risk.*", "atlas.accounting.*", "atlas.execution.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
