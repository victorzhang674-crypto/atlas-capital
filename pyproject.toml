[project]
name = "atlas-capital"
version = "0.1.0"
description = "Atlas Capital: a multi-agent hedge fund simulator (research and paper trading only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The "core" runtime dependencies (pydantic/pydantic-settings/pyyaml/python-dotenv from Stage 02;
# structlog/python-ulid from Stage 03; exchange-calendars/pandas from Stage 05; duckdb/pyarrow
# from Stage 06; httpx/yfinance from Stage 07; rapidfuzz from Stage 11; typer/rich from Stage 14).
dependencies = [
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=3.0",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "structlog>=24.1",
    "typer>=0.12",
    "yfinance>=0.2.50",
]

[project.scripts]
# The `atlas` command (Stage 14: `atlas data ...`).
atlas = "atlas.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "pandas-stubs>=3.0",
    "respx>=0.21",
]
# Heavy groups are declared now and filled by the stage that first needs them.
quant = []
llm = []
ui = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not llm and not integration'"
markers = [
    "live: hits real network services (skipped by default)",
    "llm: calls a real LLM API (skipped by default)",
    "integration: slower multi-component tests in tests/integration (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Governing docs are owner-edited; tooling must never rewrite code blocks inside them.
extend-exclude = ["Planning", "Project.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "TID"]

# Stage 05: one source of "now". Wall-clock reads are allowed only in atlas.core.clock.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use atlas.core.clock.get_clock().now() instead"
"datetime.datetime.utcnow".msg = "Use atlas.core.clock.get_clock().now() instead"
"datetime.datetime.today".msg = "Use atlas.core.clock.get_clock().today() instead"
"datetime.date.today".msg = "Use atlas.core.clock.get_clock().today() instead"
"time.time".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.time_ns".msg = "Use atlas.core.clock.get_clock().now() instead"
"pandas.Timestamp.now".msg = "Use atlas.core.clock.get_clock().now() instead"
"pandas.Timestamp.today".msg = "Use atlas.core.clock.get_clock().today() instead"
"pandas.Timestamp.utcnow".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.localtime".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.gmtime".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.ctime".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.asctime".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.strftime".msg = "Format get_clock().now() instead"
"time.clock_gettime".msg = "Use atlas.core.clock.get_clock().now() instead"
"time.clock_gettime_ns".msg = "Use atlas.core.clock.get_clock().now() instead"

[tool.ruff.lint.per-file-ignores]
"src/atlas/core/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/atlas"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Strict on the packages that hold money, risk and orders (stage protocol §3).
[[tool.mypy.overrides]]
module = ["atlas.core.*", "atlas.risk.*", "atlas.accounting.*", "atlas.execution.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# exchange_calendars, pyarrow and yfinance ship no type information (no py.typed, no stubs).
[[tool.mypy.overrides]]
module = ["exchange_calendars", "pyarrow", "pyarrow.*", "yfinance"]
ignore_missing_imports = true
