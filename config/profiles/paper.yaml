# Profile: paper — Alpaca paper trading (never live money; spec A4).

# LLM spend while paper trading.
llm:
  # Spend caps.
  budgets:
    daily_usd: 5.0  # live/paper daily LLM budget in USD (spec A8)
  # Paper trading reads live data: an answer recorded earlier must never stand in for a new call.
  cache:
    mode: off  # no lookup, nothing stored
