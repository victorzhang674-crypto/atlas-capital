# Atlas Capital — fund mandate and operating settings (base layer).
# Read by atlas.core.config.load_config. Layer order, lowest first: code defaults < this file
# < limits.yaml < universe.yaml < pods/*.yaml < profiles/<profile>.yaml < .env < ATLAS__* env
# vars < explicit overrides. Secrets never go here; they come only from env vars or .env.

# The fund mandate.
fund:
  name: Atlas Capital  # display name used in reports
  base_currency: USD  # reporting currency; only USD is supported in v1
  initial_capital: 10000000  # simulated starting NAV in base currency (spec A6: $10M)
  benchmark: SPY  # primary benchmark ticker (spec A9)

# Where data lives and who provides it.
data:
  lake_path: data  # data lake directory, relative to the repo root (gitignored)
  # Provider per data family (spec §11; free sources only, spec A3).
  providers:
    prices: yfinance  # daily bars: yfinance | alpaca
    fundamentals: sec_edgar  # point-in-time XBRL companyfacts (Stage 09)
    macro: fred  # FRED / ALFRED with vintages (Stage 10)
    news: alpaca  # timestamped news: alpaca | yahoo (Stage 11)
  # Daily price fetching and checks (Stage 07).
  prices:
    batch_size: 50  # symbols per vendor request
    max_retries: 3  # retries after a failed vendor request
    backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
    min_request_interval_seconds: 0.5  # rate limit: pause between vendor requests, in seconds
    request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
    alpaca_feed: iex  # Alpaca data feed: iex (free tier) | sip (paid)
    alpaca_data_url: https://data.alpaca.markets  # Alpaca market data API base URL
    adj_mismatch_tolerance: 0.005  # record recomputed vs vendor adj_close gaps above 0.5%
    memo_size: 1000  # yfinance: downloaded (symbol, window) bar sets kept per provider (LRU)
    yahoo_no_data_file: config/yahoo_no_data.yaml  # symbols Yahoo has no bars for: not requested
  # Universe reference data sources (Stage 08).
  reference:
    sp500_constituents_url: https://en.wikipedia.org/wiki/List_of_S%26P_500_companies  # constituents table
    sp500_changes_url: https://en.wikipedia.org/wiki/Historical_components_of_the_S%26P_500  # change log
    user_agent: AtlasCapital/0.1 (research and paper-trading simulator)  # sent with every request
    request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
    ticker_changes_file: config/ticker_changes.yaml  # manual ticker renames, relative to the repo root
    known_anomalies_file: config/membership_anomalies.yaml  # reviewed change-log anomalies, logged at info
  # SEC EDGAR fundamentals (Stage 09). The User-Agent comes from the SEC_USER_AGENT secret (.env).
  fundamentals:
    company_tickers_url: https://www.sec.gov/files/company_tickers.json  # ticker -> CIK list
    companyfacts_url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json  # XBRL facts per company
    submissions_url: https://data.sec.gov/submissions/CIK{cik:010d}.json  # filing index (acceptance times)
    submissions_page_url: https://data.sec.gov/submissions/{name}  # older filing-index pages
    max_requests_per_second: 10  # rate limit; the SEC allows at most 10 requests per second
    request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
    max_retries: 3  # retries after a failed request (transport error, HTTP 429 or 5xx)
    backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
    xbrl_map_file: config/xbrl_map.yaml  # concept map (tags per concept), relative to the repo root
    quarter_days: [80, 100]  # a duration in this range of days is a fiscal quarter (52/53-week years)
    annual_days: [350, 380]  # a duration in this range of days is a fiscal year
    max_staleness_days: 400  # a metric whose period ended longer ago than this is not used (NaN)
    cik_overrides_file: config/cik_overrides.yaml  # verified CIKs of former S&P 500 members, relative to the repo root
  # FRED / ALFRED macro data (Stage 10). The API key comes from the FRED_API_KEY secret (.env).
  macro:
    api_url: https://api.stlouisfed.org/fred  # FRED API base URL
    max_requests_per_second: 2  # rate limit; FRED allows 120 requests per minute
    request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
    max_retries: 3  # retries after a failed request (transport error, HTTP 429 or 5xx)
    backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
    series_file: config/macro.yaml  # series catalog (kind, release time), relative to the repo root
    observation_start: 2000-01-01  # first observation date ingested
    vintage_start: 1776-07-04  # first vintage ingested; FRED's earliest date = every vintage
    max_vintage_dates_per_request: 2000  # vintages per observations request (FRED's JSON limit)
    page_limit: 100000  # rows per observations page (FRED's maximum)
    market_lag_days: 1  # a market series' value is available this many calendar days after its date
    market_available_time: "06:00"  # ... at this time, America/New_York (before the 08:00 decision); quoted for YAML
    transform_lag_tolerance_days: 7  # a YoY / 3-month lagged value may be this many days early
    zscore_window_years: 10  # trailing window of the macro z-score, in years
    zscore_min_years: 5  # history needed before a z-score is given, in years
  # Company and market news (Stage 11). Alpaca keys come from the ALPACA_API_* secrets (.env).
  news:
    alpaca_news_url: https://data.alpaca.markets/v1beta1/news  # Alpaca (Benzinga) news endpoint
    page_limit: 50  # articles per page; Alpaca's maximum is 50
    symbols_per_request: 50  # tickers per Alpaca request
    max_retries: 3  # retries after a failed request (transport error, HTTP 429 or 5xx)
    backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
    min_request_interval_seconds: 0.3  # rate limit: pause between requests (free tier: 200/min)
    request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
    yahoo_max_items: 20  # Yahoo fallback: recent articles asked per symbol
    max_summary_chars: 1000  # summaries are cut to this many characters (no article bodies)
    dedup_window_hours: 48  # two copies of a story are at most this many hours apart
    fuzzy_threshold: 92  # headline similarity (rapidfuzz ratio, 0-100) that marks a duplicate
    roundup_max_symbols: 10  # more tags than this = roundup, dropped unless the headline names the ticker
    headline_relevance: 1.0  # relevance when the headline names the ticker
    symbols_relevance: 0.5  # relevance when the ticker is only in the tags (must be lower)
    market_symbols: [SPY, QQQ]  # market-wide news = untagged or tagged with one of these
    lookback_days: 14  # default query window, calendar days before the cutoff
    limit: 50  # default number of articles a query returns
  # Corporate and macro events (Stage 12).
  events:
    macro_calendar_file: config/macro_calendar.yaml  # FOMC meetings and FRED release definitions, relative to the repo root
    history_start: 2015-01-01  # earnings events are read from EDGAR filings filed from this date
    periodic_match_days: 60  # a 10-Q/10-K is an earnings event only without an 8-K item 2.02 in these calendar days before it
    upcoming_earnings: yahoo  # optional provider of scheduled earnings dates: yahoo | none
    max_retries: 3  # retries after a failed upcoming-earnings request
    backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
    min_request_interval_seconds: 0.5  # rate limit: pause between upcoming-earnings requests, in seconds
    scheduled_match_days: 10  # a scheduled date is dropped once an actual earnings event this many calendar days before it (or later) is known
    reaction_days: 3  # sessions in the earnings reaction window, from the reaction session
    reaction_benchmark: SPY  # abnormal returns are measured against this symbol
    horizon_days: 14  # default window of upcoming events, calendar days after the as-of day
    past_n: 8  # default number of past events returned
    estimate_earnings: true  # without a scheduled date, estimate the next earnings date (a past one + 52 weeks)
    estimate_min_gap_days: 20  # an estimate must fall more than this many calendar days after the latest actual event
  # Numeric news sentiment (Stage 12). The lexicon is free for academic research only, so it is downloaded, not committed.
  sentiment:
    lexicon_file: data/reference/lm_lexicon.csv  # Loughran-McDonald word lists (word,category), relative to the repo root (gitignored)
    lexicon_url: https://drive.usercontent.google.com/download?id=1iq2RUf8qGFEAk1g8wQntP3habOnR3fXF&export=download&confirm=t  # LM master dictionary CSV (sraf.nd.edu)
    negation_window: 3  # a positive word with no/not/none/neither/never/nobody this many words before it is not counted
    half_life_days: 3.0  # an article's weight halves every this many days of age
    lookback_days: 14  # articles of this many calendar days before the cutoff enter the score
    max_articles: 500  # at most this many articles enter one score
    daily_days: 90  # default length of the daily sentiment series, in sessions
    # Optional social-media posts; off by default.
    social:
      enabled: false  # fetch StockTwits / Reddit posts only when true
      providers: [stocktwits, reddit]  # providers used, in order
      stocktwits_url: https://api.stocktwits.com/api/2/streams/symbol  # StockTwits symbol stream base URL
      reddit_url: https://www.reddit.com  # Reddit base URL (public JSON search)
      reddit_subreddits: [wallstreetbets, stocks, investing]  # subreddits searched for the symbol
      max_items: 100  # posts asked per request; Reddit's maximum is 100
      lookback_days: 7  # default query window, calendar days before the cutoff
      limit: 50  # default number of posts a query returns
      max_retries: 3  # retries after a failed request (transport error, HTTP 429 or 5xx)
      backoff_seconds: 1.0  # wait before the first retry, in seconds; doubles on each retry
      min_request_interval_seconds: 1.0  # rate limit: pause between requests, in seconds
      request_timeout_seconds: 30  # timeout of one HTTP request, in seconds
      user_agent: AtlasCapital/0.1 (research and paper-trading simulator)  # sent with every request
  # Data quality checks (Stage 13), run on the data known at the as-of cutoff; a critical issue blocks its symbol in DataView that day.
  quality:
    window_sessions: 21  # a report covers the last this many sessions whose bars are known
    stale_min_sessions: 5  # this many consecutive unchanged closes (each with volume > 0) make a stale price
    outlier_sigma: 8.0  # a daily return beyond this many standard deviations is an outlier
    outlier_vol_window: 63  # trailing returns in the standard deviation (the day itself excluded)
    outlier_min_returns: 20  # fewer trailing returns than this: the day is not checked
    outlier_min_daily_vol: 0.005  # floor of the daily standard deviation, as a fraction (0.5%)
    split_ratios: [2, 3, 4, 5, 8, 10, 15, 20, 1.5]  # an outlier moving the price by 1/k or k with no recorded action is an unrecorded split
    split_ratio_tolerance: 0.03  # relative tolerance of that match (3%)
    fundamentals_jump_ratio: 10.0  # a quarter-over-quarter change of more than this factor, either way, is flagged
    # Largest gap between consecutive macro observations, calendar days, by inferred frequency.
    macro_max_gap_days:
      daily: 7  # daily series (market quotes)
      weekly: 14  # weekly series (initial claims)
      monthly: 45  # monthly series
      quarterly: 135  # quarterly series
      annual: 400  # annual series
    # Largest age of the last macro observation on the as-of day, calendar days (publication lag included).
    macro_max_age_days:
      daily: 10  # daily series
      weekly: 21  # weekly series
      monthly: 100  # monthly series (core PCE comes about two months after its month starts)
      quarterly: 230  # quarterly series
      annual: 550  # annual series
    # Severity per check: info | warning | critical (critical blocks the symbol or series).
    severity:
      missing_sessions: warning  # a session with no bar between a symbol's first and last bar in the window
      stale_price: critical  # close unchanged for stale_min_sessions sessions with volume
      return_outlier: warning  # return beyond outlier_sigma with no corporate action (can be real news)
      ohlc_inconsistent: critical  # high/low not bounding open/close, missing OHLC or negative volume
      nonpositive_price: critical  # an open, high, low or close at or below zero
      split_mismatch: critical  # a recorded action that does not explain the move, or an unrecorded split
      fundamentals_jump: warning  # a fundamental value changing more than fundamentals_jump_ratio in a quarter
      macro_gap: warning  # a macro series with a gap or no recent observation
      vendor_mix: warning  # bars from more than one vendor in the window (IEX vs consolidated volume)
      fundamentals_period_after_filing: warning  # an XBRL fact dated after its own filing (left out of the point-in-time view)
  # DataView (Stage 13): the single point-in-time door to the data.
  view:
    cache_size: 256  # results kept in the LRU cache shared by a view and the views advance() creates
    fundamentals_cache_size: 5000  # per-symbol fundamentals kept across as-of days until a new filing is known
  # Liquidity filters of Universe.tradable (Stage 08); only bars known before the cutoff count.
  tradable:
    min_price: 5.0  # last raw close, USD
    min_adv_usd: 20000000  # mean raw close x volume over adv_window_days bars, USD
    adv_window_days: 20  # bars in the ADV average
    min_history_days: 252  # bars of price history required
    max_stale_sessions: 5  # the last bar may lag the latest known session by this many sessions
  # Data sync and backfill (Stage 14): atlas data sync | update | status | quality.
  sync:
    default_start: 2015-01-01  # first date of a sync without --from
    state_file: cache/sync_state.json  # resume checkpoint, relative to the lake root
    update_overlap_days: 5  # windowed datasets re-fetch this many calendar days before a key's covered end
    empty_retry_days: 30  # a key with no vendor data in its whole history (delisted) is re-checked after this many days
    news_window_days: 90  # news is fetched and checkpointed in windows of this many calendar days
    sentiment_window_days: 365  # news scoring runs in windows of this many calendar days
    status_min_price_years: 8.0  # status: years between first and last bar for "enough price history"
    universe: sp500  # index universe whose members (at any time in the window) are synced
    archive_raw: true  # keep every price and news answer as it arrived under raw/<vendor>/ in the lake
    # Threads per provider pool; each client's throttle still bounds its request rate.
    workers: {yahoo: 1, sec: 4, fred: 2, alpaca: 2, wikipedia: 1, local: 1}  # yahoo stays 1: yfinance is not thread-safe
    # Keys (symbols or macro series) per chunk; the checkpoint is written after each chunk.
    chunk_size: {prices: 50, fundamentals: 20, macro: 2, news: 50, earnings: 20, upcoming: 50, social: 20}  # per step

# Quant engine (Phase 2).
quant:
  # Technical feature library (Stage 15, atlas.quant.features).
  features:
    buffer_sessions: 63  # sessions loaded beyond a feature's lookback: missing bars and EMA/Wilder warm-up
    sessions_per_year: 252  # trading sessions per year, to annualise volatilities
    # Per-symbol TechnicalSnapshot for the agents: percentiles vs own history and vs a universe.
    snapshot:
      history_sessions: 252  # own-history window of a feature, sessions (today included)
      min_history: 63  # fewest valid own-history values for an own-history percentile
      universe: sp500  # universe whose members at as_of form the cross-section (plus the requested symbols)
      min_universe: 20  # fewest valid cross-section values for a universe percentile
  # Fundamental factor library (Stage 16, atlas.quant.factors).
  factors:
    universe: sp500  # universe whose members at as_of get factor exposures by default
    winsor_lower: 0.01  # cross-sectional quantile each factor is clipped at from below (fraction)
    winsor_upper: 0.99  # cross-sectional quantile each factor is clipped at from above (fraction)
    min_names: 20  # fewest valid raw values for a factor to be cleaned; fewer leaves it all NaN
    size_neutral: false  # also regress each factor (except size) on the size exposure
    period_tolerance_days: 20  # a year-ago fiscal period may end this many days from 365 (1095) days before the latest
    margin_quarters: 8  # discrete quarters of gross margin in margin stability
    min_abs_eps: 0.01  # USD; EPS growth is NaN when the year-ago TTM EPS is smaller in absolute value
    max_price_age_sessions: 5  # market cap needs a close from the last this many known sessions
  # Signal research toolkit (Stage 17, atlas.quant.research): IC, quantiles, decay, L/S backtest.
  research:
    universe: sp500  # names evaluated on each date: the members of this universe at that date
    horizons: [1, 5, 21, 63]  # forward-return horizons in sessions (label = close of t to close of t+h)
    frequency: monthly  # evaluation dates: first session of each daily | weekly | monthly period
    n_quantiles: 5  # buckets of the quantile analysis and the long-short legs (top vs bottom)
    min_names: 20  # fewest names with both a signal and a label for a date's IC and quantiles
    min_group_names: 10  # fewest such names inside one sector for the by-sector IC
    autocorr_lags: [1, 2, 3, 6, 12]  # lags (evaluation dates) of the signal rank autocorrelation
    rolling_ic_window: 12  # evaluation dates in the rolling mean of the IC chart
    out_dir: runs/research  # tear sheets go to <lake>/<out_dir>/<signal name>/ (relative to the lake)
    # Vectorised long-short backtest (top minus bottom quantile).
    backtest:
      rebalance: monthly  # first evaluation date of each signal | weekly | monthly | quarterly period
      weighting: equal  # equal | signal (weights grow with the rank's distance from the median)
      cost_bps: 5.0  # basis points per unit of one-side turnover (cf. backtest.costs.half_spread_bps)
      gross: 2.0  # long leg + |short leg| as a fraction of NAV (2.0 = 100% long, 100% short)
  # Covariance and volatility forecasting (Stage 18, atlas.quant.risk_model); daily returns in, daily units out.
  risk_model:
    min_history: 63  # fewest returns of a name (and common sessions of a pair, pairwise) to estimate it; fewer drops it
    missing: pairwise  # pairwise (each pair on its common sessions, then nearest PSD) | complete (sessions where all have a return)
    max_condition: 1.0e+5  # largest condition number of a covariance; above it the small eigenvalues are floored
    default_method: ledoit_wolf  # sample | ewma | ledoit_wolf (constant-correlation target) | oas
    ewma_lambda: 0.94  # EWMA decay per session (RiskMetrics daily)
    # Next-session volatility forecasts of single names.
    volatility:
      method: blend  # default next-session vol forecast: ewma | garch | realised | blend
      realised_window: 21  # sessions in the realised vol (root mean square of daily returns)
      garch_min_obs: 252  # fewest returns to fit GARCH(1,1); fewer (or a failed fit) falls back to EWMA
      # Blend of next-session variances (fractions, summing to 1).
      blend_weights:
        ewma: 0.4  # weight of the EWMA variance
        garch: 0.4  # weight of the GARCH(1,1) variance
        realised: 0.2  # weight of the realised variance
    # Barra-style factor risk model (Stage 19, atlas.quant.risk_model.factor_model).
    factor_model:
      sectors: [Communication Services, Consumer Discretionary, Consumer Staples, Energy, Financials, Health Care, Industrials, Information Technology, Materials, Real Estate, Utilities]  # sector factors (GICS names as in the instruments table)
      factor_half_life: 90  # EWMA half-life of the factor covariance, in sessions
      newey_west_lags: 2  # lags of the Newey-West autocovariance adjustment (0 = none)
      specific_half_life: 90  # EWMA half-life of the specific (residual) variance, in sessions
      min_cross_section: 100  # fewest names in a daily cross-sectional regression
      style_winsor_lower: 0.01  # lower quantile at which raw style values are clipped
      style_winsor_upper: 0.99  # upper quantile at which raw style values are clipped
      max_missing_styles: 2  # a name missing more styles than this is left out of the model
      shrinkage_q: 1.0  # strength of the specific-vol shrinkage to the sector median (0 = none)
      specific_floor_vol: 0.002  # smallest specific vol, daily fraction (0.2%)
      anchor_months: 1  # months between refreshes of the fundamental styles (1 = every month-end, 3 = quarter-ends)
      max_stale_sessions: 5  # a model needs factor returns within this many sessions before its as-of
      # ETF exposures from time-series regressions on the factor returns.
      etf:
        universe: macro_etfs  # ETF universe whose exposures are estimated by default
        window: 252  # sessions of returns in each ETF regression
        min_obs: 126  # fewest observed returns to estimate an ETF (fewer drops it)
        ridge: 1.0e-3  # ridge penalty relative to the mean diagonal of F'F
  # Risk and performance metrics library (Stage 20, atlas.quant.metrics). VaR/CVaR confidence, ADV participation and window come from limits.yaml.
  metrics:
    risk_free_annual: 0.0  # default risk-free rate for Sharpe, alpha and beta, annual fraction (converted geometrically per session)
    rolling_window: 63  # default window of rolling metrics, sessions
    tail_quantile: 0.05  # lower quantile of the tail ratio |q(1-t)| / |q(t)|
    omega_threshold_annual: 0.0  # default Omega ratio threshold, annual fraction
    var_method: historical  # default VaR/CVaR method on a series: historical | normal | cornish_fisher
    var_min_obs: 63  # fewest observations for any VaR/CVaR; fewer raise DataError
    horizon_method: sqrt  # multi-session historical VaR: sqrt (square-root-of-time) | overlapping (h-session returns)
    zero_mean: true  # parametric VaR (normal, Cornish-Fisher) assumes a zero mean return
    mc_simulations: 20000  # Monte Carlo VaR scenarios
    liquidity_horizons: [1, 3, 5]  # sessions at which the liquid share of a book is reported
    adv_min_coverage: 0.9  # an ADV from the data must cover this share of its window's sessions, else no usable ADV
    cornish_fisher_z_max: 4.0  # Cornish-Fisher VaR needs its quantile map increasing on |z| <= this (4 = 99.994% of the mass), else DataError

# LLM gateway values (consumed by Stage 24).
llm:
  provider: anthropic  # anthropic | openai_compatible (spec A2)
  # Model id per tier (spec §11).
  tiers:
    deep: claude-opus-5-5  # long-form reasoning: research, debate, IC
    quick: claude-haiku-5-5  # cheap, fast calls: extraction, summaries
  # Spend caps; exceeding one raises BudgetExceeded and callers fail safe (Stage 24).
  budgets:
    daily_usd: 5.0  # USD per day, live/paper (spec A8)
    per_run_usd: 25.0  # USD per backtest run; provisional, revisit in Stage 24/56
    per_agent_call_max_tokens: 8000  # output token cap per call; provisional, revisit in Stage 24

# Backtest window and simulated costs.
backtest:
  start: 2018-01-01  # first session (spec A7)
  in_sample_end: 2021-12-31  # last in-sample session; out-of-sample from 2022 (spec A7)
  end: null  # last session; null = latest available
  # Simulated trading costs (Stage 51 refines these).
  costs:
    half_spread_bps: 5.0  # half bid-ask spread in basis points; Stage 51 adds market-cap buckets
    impact_k: 0.1  # square-root impact coefficient k in k*sigma*sqrt(Q/ADV)
    commission_per_share: 0  # USD per share (Alpaca-like zero commission)
    borrow_gc_annual: 0.003  # general-collateral borrow fee for shorts, annual fraction (0.3%)

# Trading calendar and point-in-time timing (Stage 05).
calendar:
  start: 2000-01-01  # first date the XNYS trading calendar covers
  end: 2030-12-31  # last date the XNYS trading calendar covers
  decision_time: "08:00"  # daily decision cutoff, America/New_York (pre-market); quoted for YAML
  bar_publish_lag_minutes: 15  # a daily bar is known this many minutes after the session close
