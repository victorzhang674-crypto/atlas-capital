# Reviewed GICS sectors of former S&P 500 members (Stage 08; added in the Phase 2 checkpoint,
# 2026-11-13), read by atlas.data.reference.load_former_sectors; not part of load_config.
#
# Why: the constituents page gives a sector to current members only, so a former member had
# none: it was scored against the whole market instead of its sector, and the risk model left
# it out. This file gives a sector to the 181 former members that have price bars in the lake
# (KVUE added 2026-11-14: it left the index on 2026-10-30).
# A current member always keeps the page's sector; an entry here is used only while the symbol
# is not on the page. The 177 former members without price bars are not listed (they cannot
# enter a panel).
#
# How each entry was chosen: the company's GICS sector as the assistant knows it (the sector
# today for a company that still trades, else the one it had when it left the index, updated
# for the 2018 and 2023 GICS changes), checked against its EDGAR SIC code. For 134 of the 180
# the sector that most current members with the same SIC code have is the same; for the other
# 46 the SIC code points elsewhere or nowhere (department stores and car dealers land in
# Consumer Staples, chemicals in Health Care) and the entry follows the company, not the code.
# These are sectors as of now, not point in time, like the page's.
#
# THIS LIST IS NOT FROM A DATA PROVIDER. The comment on each line gives the company, its SIC
# code and, where the choice is less certain, why. Correct a line by editing it; the next
# `atlas data sync --datasets universe` applies the file, and the factor cache and the risk
# model must then be rebuilt (`atlas factors build --refresh`, `atlas risk-model build`).
# Review table with the SIC comparison: Planning/stages/stage-08-universe/artifacts/
# phase2-checkpoint-tier3-former-sectors-review.md

