# Local hooks: `uv run pre-commit install` from the main checkout. CI (.github/workflows/ci.yml)
# runs `make check` instead, which covers the ruff hooks.
# Every hook runs a tool from uv.lock through `uv run`, so the hooks use the same versions as
# `make check` and need no network (remote hook repos pin their own versions and fetch them
# from GitHub at install time). Recorded fixtures under tests/fixtures/ stay byte-exact.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --no-sync end-of-file-fixer
        language: system
        types: [text]
        exclude: ^(Project\.md|Planning/)|^tests/fixtures/
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --no-sync trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^(Project\.md|Planning/)|^tests/fixtures/
