# Optional local hooks: `uv run pre-commit install`. Not run in CI (there is none in v1).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(Project\.md|Planning/)
      - id: trailing-whitespace
        exclude: ^(Project\.md|Planning/)
